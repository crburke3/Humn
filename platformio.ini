[env:wireless_tracker]
; ESP32-C6 Arduino needs Arduino-ESP32 3.x / ESP-IDF 5.x support.
; The official PlatformIO espressif32 package in this install still rejects C6
; for Arduino, so use the pioarduino platform fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; macOS: prefer /dev/cu.* for stable uploads/monitoring.
; Leave this unset unless you want to pin one physical board.
; upload_port = /dev/cu.usbmodem101
; if uploads are flaky, this avoids the higher baud switch
upload_speed = 115200
; ESP32-C6-WROOM-1-N8 on the Humn PCB has 8MB flash.
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    -D CONFIG_LOG_DEFAULT_LEVEL=ERROR
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Custom Humn PCB is headless; keep sleep disabled while validating hardware.
    -D HUMN_DISABLE_AUTO_SLEEP=1
    -D HUMN_DISABLE_MANUAL_DEEP_SLEEP=1
lib_deps =
    adafruit/Adafruit BusIO
    jgromes/RadioLib
    adafruit/Adafruit DRV2605 Library
